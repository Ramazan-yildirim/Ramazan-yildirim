<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub stats — yerel önizleme</title><style>:root{color-scheme:dark light;--bg:#090d12;--text:#e6edf3;--muted:#9ba8b7;--line:#30363d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,sans-serif}main{max-width:768px;margin:40px auto;padding:0 24px}h1{font-size:20px;margin:0 0 4px}p{color:var(--muted);margin:0 0 24px}section{margin:0 0 18px}img{display:block;max-width:100%;height:auto}footer{border-top:1px solid var(--line);padding-top:16px;margin-top:28px;color:var(--muted);font-size:12px}a{color:inherit}@media(prefers-color-scheme:light){:root{--bg:#fff;--text:#24352a;--muted:#53685b;--line:#c8d2c5}}@media(max-width:600px){main{margin:24px auto;padding:0 16px}h1{font-size:18px}}</style><main><h1>GitHub stats</h1><p>Mevcut canlı servisten alınan verilerle yerel tasarım önizlemesi. Açık/koyu tema ve mobil yerleşim tarayıcıya göre seçilir.</p><section><picture><source media="(max-width:600px) and (prefers-color-scheme:light)" srcset="stats-light-compact.svg"><source media="(max-width:600px)" srcset="stats-dark-compact.svg"><source media="(prefers-color-scheme:light)" srcset="stats-light.svg"><img src="stats-dark.svg" alt="GitHub activity with a circular streak highlight" width="720"></picture></section><section><picture><source media="(max-width:600px) and (prefers-color-scheme:light)" srcset="languages-light-compact.svg"><source media="(max-width:600px)" srcset="languages-dark-compact.svg"><source media="(prefers-color-scheme:light)" srcset="languages-light.svg"><img src="languages-dark.svg" alt="Repository language distribution in a donut chart" width="720"></picture></section><footer>Bu dosya bir önizlemedir; canlı kartlar stats deposu yayımlandığında güncellenir.<br>Veri kaynağı: mevcut <a href="https://ramazan-github-stats.vercel.app/api/stats">stats</a> ve <a href="https://ramazan-github-stats.vercel.app/api/languages">languages</a> kartlarının anlık görüntüsü.</footer></main></html>
